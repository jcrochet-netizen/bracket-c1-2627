name: Refresh C1 26-27 live bracket

# Régénère les data-*.json depuis SportMonks et les commit s'ils ont changé.
on:
  schedule:
    # Soirs de Ligue des champions (mardi, mercredi, jeudi) : toutes les 10 min.
    # Les coups d'envoi sont à 18h45 et 21h00 Paris, soit 16h45/19h00 UTC l'été
    # et 17h45/20h00 UTC l'hiver — la plage 16h-23h UTC couvre les deux.
    - cron: "*/10 16-23 * * 2,3,4"
    # Veille de fond le reste du temps : calendrier, reports, tirages.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-c1-bracket
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch SportMonks data
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node fetch-data.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `updatedAt` bouge à chaque exécution : on compare les fichiers SANS
          # ce champ, sinon le cron produirait un commit toutes les 10 minutes
          # même quand aucun score n'a changé. (Le JSON tient sur une seule
          # ligne, donc `git diff -I` ne peut pas faire ce travail.)
          if node .github/data-changed.js; then
            git add data*.json
            git commit -m "chore: refresh C1 26-27 live data [skip ci]"
            git push
            echo "Données mises à jour et poussées."
          else
            echo "Aucun résultat nouveau — rien à commit."
            git checkout -- 'data*.json' || true
          fi
