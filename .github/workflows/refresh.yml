name: Refresh C1 26-27 results

# Régénère les data-*.json depuis SportMonks et les commit s'ils ont changé.
#
# Le widget n'affiche AUCUN score en direct : un match n'a de résultat que
# lorsqu'il est terminé. Le cron ne passe donc qu'APRÈS les coups de sifflet
# final, au lieu de sonder l'API toutes les 10 minutes toute la soirée.
#
# Repères horaires, valables été comme hiver :
#   18h45 Paris = 16h45 UTC l'été / 17h45 l'hiver → fin vers 18h40 / 19h40 UTC
#   21h00 Paris = 19h00 UTC l'été / 20h00 l'hiver → fin vers 20h55 / 21h55 UTC
# Les deux passages ci-dessous tombent après la fin dans les deux régimes.
on:
  schedule:
    - cron: "50 19 * * 2,3,4"   # après les matchs de 18h45
    - cron: "10 22 * * 2,3,4"   # après les matchs de 21h00
    - cron: "20 5 * * *"        # filet quotidien : calendrier, reports, tirages
  workflow_dispatch: {}         # bouton « Run workflow », pour un rattrapage

permissions:
  contents: write

concurrency:
  group: refresh-c1-bracket
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch SportMonks data
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node fetch-data.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `updatedAt` bouge à chaque exécution : on compare les fichiers SANS
          # ce champ, sinon le cron produirait un commit toutes les 10 minutes
          # même quand aucun score n'a changé. (Le JSON tient sur une seule
          # ligne, donc `git diff -I` ne peut pas faire ce travail.)
          if node .github/data-changed.js; then
            git add data*.json
            git commit -m "chore: refresh C1 26-27 live data [skip ci]"
            git push
            echo "Données mises à jour et poussées."
          else
            echo "Aucun résultat nouveau — rien à commit."
            git checkout -- 'data*.json' || true
          fi
